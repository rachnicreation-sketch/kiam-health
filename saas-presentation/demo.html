<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demander une démo — Kiam SaaS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="section" style="padding-top: 4rem;">
      <div class="container container-md">
        <div class="card" style="max-width: 600px; margin: 0 auto; padding: 3rem;">
          <div style="text-align: center; margin-bottom: 2.5rem;">
            <h1 class="text-heading" style="font-size: 2.5rem;">Voir Kiam en action</h1>
            <p class="text-small mt-1">Remplissez ce formulaire. Un expert vous contactera sous 24h pour une présentation personnalisée.</p>
          </div>
          
          <form onsubmit="event.preventDefault(); alert('Votre demande de démo a bien été enregistrée.');">
            <div class="form-group">
              <label class="form-label">Nom complet</label>
              <input type="text" class="form-input" placeholder="Ex: Jean Dupont" required>
            </div>
            
            <div class="form-group">
              <label class="form-label">Email professionnel</label>
              <input type="email" class="form-input" placeholder="jean@entreprise.com" required>
            </div>
            
            <div class="form-group">
              <label class="form-label">Nom de l'entreprise</label>
              <input type="text" class="form-input" placeholder="Ma Clinique" required>
            </div>
            
            <div class="grid-2" style="gap: 1.25rem;">
              <div class="form-group">
                <label class="form-label">Secteur</label>
                <select class="form-select" required>
                  <option value="" disabled selected>Sélectionner...</option>
                  <option value="health">Santé & Clinique</option>
                  <option value="commerce">Commerce & ERP</option>
                  <option value="school">École</option>
                  <option value="hotel">Hôtellerie</option>
                  <option value="pharmacy">Pharmacie</option>
                  <option value="enterprise">Services / PME</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Taille</label>
                <select class="form-select" required>
                  <option value="" disabled selected>Sélectionner...</option>
                  <option value="1-10">1 à 10 employés</option>
                  <option value="11-50">11 à 50 employés</option>
                  <option value="50+">Plus de 50 employés</option>
                </select>
              </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block mt-2">Soumettre la demande</button>
            <p class="text-center text-xs mt-3">En validant ce formulaire, vous acceptez notre politique de confidentialité.</p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/components.js"></script>
</body>
</html>
