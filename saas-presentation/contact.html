<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Kiam SaaS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="section" style="padding-top: 4rem;">
      <div class="container container-md">
        <div class="grid-2" style="gap: 4rem; align-items: start;">
          <div>
            <h1 class="text-display" style="font-size: 3rem;">Discutons de votre projet</h1>
            <p class="text-body mt-2" style="margin-bottom: 2rem;">Vous avez une question sur nos offres, un besoin spécifique ou vous souhaitez un partenariat ? Laissez-nous un message.</p>
            
            <div style="display:flex;flex-direction:column;gap:1.5rem;">
              <div>
                <h4 class="text-heading" style="font-size: 1.125rem;">Email</h4>
                <p class="text-small">contact@kiam.app</p>
              </div>
              <div>
                <h4 class="text-heading" style="font-size: 1.125rem;">Téléphone</h4>
                <p class="text-small">+1 234 567 890</p>
              </div>
              <div>
                <h4 class="text-heading" style="font-size: 1.125rem;">Bureaux</h4>
                <p class="text-small">Centre d'Affaires, Abidjan<br>Côte d'Ivoire</p>
              </div>
            </div>
          </div>
          
          <div class="card p-6">
            <form onsubmit="event.preventDefault(); alert('Message envoyé avec succès !');">
              <div class="form-group">
                <label class="form-label">Sujet de votre demande</label>
                <select class="form-select" required>
                  <option value="support">Support Technique</option>
                  <option value="sales">Ventes & Tarifs</option>
                  <option value="partner">Partenariats</option>
                  <option value="other">Autre</option>
                </select>
              </div>
              
              <div class="form-group">
                <label class="form-label">Votre Email</label>
                <input type="email" class="form-input" required>
              </div>
              
              <div class="form-group">
                <label class="form-label">Message</label>
                <textarea class="form-input" rows="4" required></textarea>
              </div>
              
              <button type="submit" class="btn btn-primary btn-block mt-2">Envoyer le message</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/components.js"></script>
</body>
</html>
